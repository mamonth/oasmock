name: Smoke Test Docker Image
description: Build the release Docker image with the same build-push-action configuration used for publishing, load it locally, and verify the mock server starts and serves the control API over plain HTTP and HTTPS.

inputs:
  image-name:
    description: Local tag for the smoke-test image.
    required: true
  platforms:
    description: Platform(s) to build for local testing (single platform only, since it is loaded into the local daemon).
    required: false
    default: linux/amd64

runs:
  using: composite
  steps:
    - name: Build Docker image for smoke test
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ inputs.platforms }}
        push: false
        load: true
        tags: ${{ inputs.image-name }}
        cache-from: type=gha
        cache-to: type=gha

    - name: Smoke test image
      shell: bash
      run: |
        cert_dir="$(mktemp -d)"
        cleanup() {
          docker rm -f oasmock-smoke >/dev/null 2>&1 || true
          rm -rf "$cert_dir"
        }
        trap cleanup EXIT

        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout "$cert_dir/key.pem" -out "$cert_dir/cert.pem" \
          -subj "/CN=localhost" >/dev/null 2>&1
        # The container runs as UID 65532; keep the mounted pair readable.
        chmod 644 "$cert_dir/cert.pem" "$cert_dir/key.pem"

        docker run -d --name oasmock-smoke -p 19191:19191 -p 8443:8443 \
          -e OASMOCK_TLS_CERT=/certs/cert.pem \
          -e OASMOCK_TLS_KEY=/certs/key.pem \
          -e OASMOCK_TLS_PORT=8443 \
          -v "$GITHUB_WORKSPACE/api/openapi.yaml:/app/src/openapi.yaml" \
          -v "$cert_dir:/certs:ro" \
          "${{ inputs.image-name }}" >/dev/null
        for _ in $(seq 1 15); do
          if curl -sf http://localhost:19191/_mock/requests >/dev/null 2>&1 \
            && curl -kfsS https://localhost:8443/_mock/requests >/dev/null 2>&1; then
            echo "Smoke test passed: server serving HTTP on :19191 and HTTPS on :8443"
            exit 0
          fi
          sleep 1
        done
        echo "ERROR: smoke test failed - server did not serve HTTP :19191 and HTTPS :8443 within 15s"
        echo "--- container logs ---"
        docker logs oasmock-smoke 2>&1 || true
        exit 1
