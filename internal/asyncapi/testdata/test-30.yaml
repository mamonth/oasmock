asyncapi: 3.0.0
info:
  title: User Events
  version: 1.0.0
channels:
  userSignedUp:
    address: user/signedup
    messages:
      auserSignedUp:
        payload:
          type: object
          properties:
            id:
              type: string
        examples:
          - name: ex1
            payload:
              id: "{$request.path.id}"
            x-mock-match:
              "{$message.payload.id}":
                type: integer
            x-mock-once: true
          - name: ex2
            payload:
              id: hello
            x-mock-set-state:
              lastEvent: signedup
operations:
  receiveUserSignedUp:
    action: receive
    channel:
      $ref: '#/channels/userSignedUp'
    messages:
      - $ref: '#/channels/userSignedUp/messages/auserSignedUp'