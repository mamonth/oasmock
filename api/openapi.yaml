openapi: 3.0.0
info:
  title: OASMock control HTTP API
  description: HTTP API for the OpenAPI-based mock tool
  version: 0.1.0
servers:
  - url: http://localhost:19191/_mock
    description: Default mock server
paths:
  /examples:
    post:
      operationId: createExample
      summary: Add a new mock example
      description: |
        Adds a custom example to the mock server for a given path and method.
        The example can be conditional based on request parameters.

        Note: the operation is not idempotent. Each successful call registers a
        distinct example (and, for async interval examples, a separate delivery
        job). Re-sending a request after a lost response creates a second
        subscription; capture the returned `id` and use `DELETE
        /_mock/examples/{id}` to stop recurring delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExampleRequest'
      responses:
        '200':
          description: Example added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddExampleResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
  /examples/{exampleId}:
    delete:
      operationId: deleteExample
      summary: Remove a dynamic example
      description: |
        Removes a dynamically added example, cancelling any recurring interval
        delivery registered under that example id.
      parameters:
        - name: exampleId
          in: path
          required: true
          description: Example id returned when the example was added
          schema:
            type: string
      responses:
        '200':
          description: Example removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '404':
          description: Unknown exampleId
  /requests:
    get:
      summary: Retrieve request history
      description: |
        Returns a list of requests that have been processed by the mock server,
        optionally filtered by path, method, time range, etc.
      parameters:
        - name: path
          in: query
          description: Filter by request path
          schema:
            type: string
        - name: method
          in: query
          description: Filter by HTTP method (GET, POST, etc.)
          schema:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        - name: limit
          in: query
          description: Maximum number of records to return (default 100, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: time_from
          in: query
          description: Filter requests from this timestamp (milliseconds since epoch)
          schema:
            type: integer
        - name: time_till
          in: query
          description: Filter requests until this timestamp (milliseconds since epoch)
          schema:
            type: integer
      responses:
        '200':
          description: Request history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestHistoryResponse'
  /events:
    post:
      operationId: fireEvent
      summary: Fire a named event on the event bus
      description: |
        Fires a named event ad-hoc, delivering it (immediately or after a delay)
        to event-driven message examples across the loaded schemas. The request
        carries a required type discriminator — V1 supports "fire" only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireEventRequest'
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '400':
          description: Invalid request (missing/unknown type or event)
  /events/fire:
    post:
      operationId: fireEventLegacy
      summary: Fire a named event (deprecated alias)
      description: |
        Deprecated alias of POST /_mock/events. Accepts the legacy body without
        the `type` discriminator (defaults to "fire") alongside the new shape.
        Kept for backward compatibility; use /_mock/events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireEventRequest'
      deprecated: true
      responses:
        '200':
          description: Event accepted
        '400':
          description: Invalid request
  /async/push:
    post:
      operationId: pushToChannel
      summary: Push a message to channel consumers
      description: |
        Pushes a message to the connected consumers of an AsyncAPI channel.
        Supports immediate or delayed delivery, targeted (by connectionId) or
        broadcast push, and runtime-expression templating of the payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Push accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '400':
          description: Invalid request
        '404':
          description: Unknown connectionId
  /async/consumers:
    get:
      operationId: listConsumers
      summary: List connected consumers per channel
      description: |
        Returns the currently connected consumers for an AsyncAPI channel,
        including open SignalR streams when applicable. The channel parameter is
        optional: when omitted, consumers across all channels are returned.
      parameters:
        - name: channel
          in: query
          required: false
          description: Channel address (omit for consumers across all channels)
          schema:
            type: string
      responses:
        '200':
          description: Consumers listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumersResponse'
  /async/disconnect:
    post:
      operationId: disconnectConsumer
      summary: Force-disconnect a consumer
      description: |
        Terminates a connected consumer's WebSocket connection, with an optional
        close reason/code, or simulates an abrupt drop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisconnectRequest'
      responses:
        '200':
          description: Consumer disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '400':
          description: Invalid request
        '404':
          description: Unknown connectionId
  /stream:
    get:
      operationId: managementStream
      summary: Management WebSocket stream (notifications)
      description: |
        Upgrades to a WebSocket stream of runtime notifications. V1 is
        notifications-only: filters are set at connect time via the events and
        channels query parameters (comma-separated, * wildcard) and the server
        pushes JSON envelopes of type event | push | consumer | schedule.
        A non-upgrade request is rejected with 405.
      parameters:
        - name: events
          in: query
          description: Comma-separated event-name globs to subscribe to (omit for all)
          schema:
            type: string
        - name: channels
          in: query
          description: Comma-separated channel-address globs to subscribe to (omit for all)
          schema:
            type: string
      responses:
        '101':
          description: |
            Switching Protocols — the connection upgrades to a WebSocket and the
            server pushes ManageEnvelope frames (per the envelope schemas; not an
            HTTP response body)
        '405':
          description: Non-upgrade request rejected
  /ws/push:
    post:
      operationId: pushToChannelLegacy
      summary: Push a message (deprecated alias)
      deprecated: true
      description: Deprecated alias of POST /_mock/async/push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Push accepted
        '400':
          description: Invalid request
        '404':
          description: Unknown connectionId
  /ws/consumers:
    get:
      operationId: listConsumersLegacy
      summary: List connected consumers (deprecated alias)
      deprecated: true
      description: Deprecated alias of GET /_mock/async/consumers.
      parameters:
        - name: channel
          in: query
          required: false
          description: Channel address (omit for all channels)
          schema:
            type: string
      responses:
        '200':
          description: Consumers listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumersResponse'
  /ws/schedule:
    post:
      operationId: scheduleRecurringPush
      summary: Schedule a recurring push (removed)
      description: |
        Removed. Recurring delivery is expressed via the interval field on
        POST /_mock/examples for an AsyncAPI target. This path answers 410 Gone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '410':
          description: Gone — use POST /_mock/examples with interval
  /ws/schedule/{pushId}:
    delete:
      operationId: stopRecurringPush
      summary: Stop a recurring push (removed)
      description: |
        Removed. Recurring delivery is stopped with DELETE /_mock/examples/{id}.
        This path answers 410 Gone.
      parameters:
        - name: pushId
          in: path
          required: true
          description: Push ID returned by the former schedule endpoint
          schema:
            type: string
      responses:
        '410':
          description: Gone — use DELETE /_mock/examples/{exampleId}
  /ws/disconnect:
    post:
      operationId: disconnectConsumerLegacy
      summary: Force-disconnect a consumer (deprecated alias)
      deprecated: true
      description: Deprecated alias of POST /_mock/async/disconnect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisconnectRequest'
      responses:
        '200':
          description: Consumer disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '400':
          description: Invalid request
        '404':
          description: Unknown connectionId
components:
  schemas:
    AddExampleRequest:
      type: object
      required:
        - response
      oneOf:
        - title: sync (OpenAPI)
          required:
            - path
            - response
          not:
            anyOf:
              - required: [protocol]
              - required: [channel]
              - required: [match]
              - required: [interval]
              - required: [delay]
        - title: async (AsyncAPI)
          required:
            - channel
            - response
          not:
            anyOf:
              - required: [path]
      properties:
        path:
          type: string
          description: The request path (including path parameters) to match (OpenAPI target)
        protocol:
          type: string
          enum: [http, ws]
          description: AsyncAPI protocol when targeting an AsyncAPI channel
        channel:
          type: string
          description: AsyncAPI channel address (prefixed) when targeting an AsyncAPI channel
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
          default: GET
          description: HTTP method to match
        match:
          type: object
          additionalProperties: true
          description: |
            AsyncAPI-only. Mirrors the x-mock-match extension against the event
            and connection contexts ({$event.*}, {$connection.*}) to drive live
            event-driven delivery. At least one condition must reference the
            event context; a connection-only or literal match is rejected.
        interval:
          type: integer
          minimum: 1
          description: |
            AsyncAPI-only. Positive millisecond cadence for recurring delivery
            (mirrors x-mock-interval).
        delay:
          type: integer
          minimum: 0
          default: 0
          description: |
            AsyncAPI-only. Millisecond delay before emission after a fire
            (mirrors x-mock-delay).
        once:
          type: boolean
          default: false
          description: If true, the example will be returned only once (when conditions are met)
        ttl:
          type: integer
          minimum: 0
          description: Time-to-live in seconds. After this duration the example becomes unavailable and is removed from memory. 0 or omitted means no expiration.
        validate:
          type: boolean
          default: true
          description: Validate the example data against the OpenAPI schema for the path
        conditions:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: object
          description: |
            Conditions to match the request. Keys can be runtime expressions,
            values can be literal values or JSON schemas for validation.
        response:
          $ref: '#/components/schemas/ExampleResponse'
    ExampleResponse:
      type: object
      required:
        - code
      properties:
        code:
          type: integer
          description: HTTP status code (required)
        headers:
          type: object
          additionalProperties:
            type: string
          description: Response headers
        body:
          oneOf: 
            - type: string
            - type: number
            - type: boolean
            - type: object
            - type: array
              items: {}
          description: Response body (JSON or text)
    AddExampleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: string
          description: Unique identifier for the added example
        kind:
          type: string
          enum: [event, interval]
          description: Trigger kind for async-driven examples (match/interval)
        jobID:
          type: string
          description: Scheduler job id for interval-driven examples
    RequestHistoryItem:
      type: object
      properties:
        ts:
          type: integer
          description: Timestamp in milliseconds since epoch
        url:
          type: string
          description: Full request URL
        method:
          type: string
          description: HTTP method
        body:
          oneOf: 
            - type: string
            - type: object
            - type: array
              items: {}
          description: Request body (parsed if JSON)
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers
    RequestHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequestHistoryItem'
    FireEventRequest:
      type: object
      required:
        - type
        - event
      properties:
        type:
          type: string
          enum: [fire]
          description: Action discriminator. V1 supports "fire" only.
        event:
          type: string
          description: The named event to fire
        payload:
          type: object
          description: Event payload exposed to consuming templates via {$event.*}
        delay:
          type: integer
          minimum: 0
          default: 0
          description: Delivery delay in milliseconds
        global:
          type: boolean
          default: false
          description: When true, the event is broadcast over all loaded schemas
    PushRequest:
      type: object
      required:
        - channel
      properties:
        channel:
          type: string
          description: AsyncAPI channel address to push to
        connectionId:
          type: string
          description: Target a specific consumer; omitted broadcasts to all
        payload:
          type: object
          description: Message payload, templated with {$state.*}/{$env.*}
        delay:
          type: integer
          minimum: 0
          default: 0
          description: Delivery delay in milliseconds
    ScheduleRequest:
      type: object
      required:
        - channel
        - interval
      properties:
        channel:
          type: string
          description: AsyncAPI channel address to push to
        interval:
          type: integer
          minimum: 1
          description: Delivery interval in milliseconds
        payload:
          type: object
          description: Message payload pushed at each interval
    ManageEnvelope:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [event, push, consumer, schedule]
          description: Envelope kind
        ts:
          type: integer
          description: Emit timestamp in milliseconds since epoch
        event:
          type: object
          properties:
            name:
              type: string
            schema:
              type: string
            global:
              type: boolean
            payload:
              type: object
              additionalProperties: true
        push:
          type: object
          properties:
            channel:
              type: string
            connectionId:
              type: string
            payload:
              type: object
              additionalProperties: true
        consumer:
          type: object
          properties:
            action:
              type: string
              enum: [connected, disconnected]
            connectionId:
              type: string
            channel:
              type: string
            streams:
              type: array
              items:
                type: object
                additionalProperties: true
        schedule:
          type: object
          properties:
            action:
              type: string
              enum: [started, stopped]
              description: started when an interval example registers, stopped when it is removed or cancelled
            exampleId:
              type: string
              description: Client-facing example id (the POST /_mock/examples id for runtime examples, the spec example name otherwise); identical for the started/stopped pair
            channel:
              type: string
            interval:
              type: integer
    DisconnectRequest:
      type: object
      required:
        - connectionId
      properties:
        connectionId:
          type: string
          description: Active consumer connection id
        reason:
          type: string
          description: Optional close reason
        code:
          type: integer
          description: Optional WebSocket close code
        abrupt:
          type: boolean
          default: false
          description: Simulate an abrupt network drop (no close frame)
    AsyncActionResponse:
      type: object
      properties:
        success:
          type: boolean
        event:
          type: string
          description: Fired event name (fire-event endpoints only)
    ConsumersResponse:
      type: object
      properties:
        consumers:
          type: array
          items:
            type: object
            properties:
              connectionId:
                type: string
              channel:
                type: string
              streams:
                type: array
                items:
                  type: object
                  properties:
                    connectionId:
                      type: string
                    invocationId:
                      type: string
                    streamId:
                      type: string
