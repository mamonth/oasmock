openapi: 3.0.0
info:
  title: OASMock control HTTP API
  description: HTTP API for the OpenAPI-based mock tool
  version: 0.1.0
servers:
  - url: http://localhost:19191/_mock
    description: Default mock server port (configurable via --port / OASMOCK_PORT)
paths:
  /examples:
    post:
      operationId: createExample
      summary: Add a new mock example
      description: |
        Adds a custom example to the mock server for a given path and method.
        The example can be conditional based on request parameters.

        Note: the operation is not idempotent. Each successful call registers a
        distinct example (and, for async interval examples, a separate delivery
        job). Re-sending a request after a lost response creates a second
        subscription; capture the returned `id` and use `DELETE
        /_mock/examples/{id}` to stop recurring delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExampleRequest'
      responses:
        '200':
          description: Example added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddExampleResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /examples/{exampleId}:
    delete:
      operationId: deleteExample
      summary: Remove a dynamic example
      description: |
        Removes a dynamically added example, cancelling any recurring interval
        delivery registered under that example id.
      parameters:
        - name: exampleId
          in: path
          required: true
          description: Example id returned when the example was added
          schema:
            type: string
      responses:
        '200':
          description: Example removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /requests:
    get:
      summary: Retrieve request history
      description: |
        Returns a list of requests that have been processed by the mock server,
        optionally filtered by path, method, time range, etc.
      parameters:
        - name: path
          in: query
          description: Filter by request path
          schema:
            type: string
        - name: method
          in: query
          description: Filter by HTTP method (GET, POST, etc.)
          schema:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
        - name: limit
          in: query
          description: Maximum number of records to return (default 1000, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
        - name: offset
          in: query
          description: Offset for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: time_from
          in: query
          description: Filter requests from this timestamp (milliseconds since epoch)
          schema:
            type: integer
        - name: time_till
          in: query
          description: Filter requests until this timestamp (milliseconds since epoch)
          schema:
            type: integer
      responses:
        '200':
          description: Request history retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestHistoryResponse'
  /events:
    post:
      operationId: fireEvent
      summary: Fire a named event on the event bus
      description: |
        Fires a named event ad-hoc, delivering it (immediately or after a delay)
        to event-driven message examples across the loaded schemas. A POST to
        the events collection is the fire action itself; the required `name`
        identity is matched by event-driven examples.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FireEventRequest'
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /async/messages:
    post:
      operationId: postMessage
      summary: Push a message to channel consumers
      description: |
        Delivers a message to the connected consumers of an AsyncAPI channel.
        Supports immediate or delayed delivery, targeted (by connectionId) or
        broadcast push, and runtime-expression templating of the payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagesRequest'
      responses:
        '200':
          description: Push accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /async/consumers:
    get:
      operationId: listConsumers
      summary: List connected consumers per channel
      description: |
        Returns the currently connected consumers for an AsyncAPI channel,
        including open SignalR streams when applicable. The channel parameter is
        optional: when omitted, consumers across all channels are returned.
      parameters:
        - name: channel
          in: query
          required: false
          description: Channel address (omit for consumers across all channels)
          schema:
            type: string
      responses:
        '200':
          description: Consumers listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumersResponse'
  /async/consumers/{connectionId}:
    delete:
      operationId: disconnectConsumer
      summary: Force-disconnect a consumer
      description: |
        Terminates a connected consumer's WebSocket connection, with optional
        close reason/code query parameters, or an abrupt flag to simulate an
        abrupt client-side drop. The consumer id is the path parameter; there
        is no request body.
      parameters:
        - name: connectionId
          in: path
          required: true
          description: Active consumer connection id
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Optional WebSocket close code
          schema:
            type: integer
        - name: reason
          in: query
          required: false
          description: Optional close reason
          schema:
            type: string
        - name: abrupt
          in: query
          required: false
          description: Simulate an abrupt network drop (no close frame)
          schema:
            type: boolean
      responses:
        '200':
          description: Consumer disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /stream:
    get:
      operationId: managementStream
      summary: Management WebSocket stream (notifications)
      description: |
        Upgrades to a WebSocket stream of runtime notifications. V1 is
        notifications-only: filters are set at connect time via the events and
        channels query parameters (comma-separated, * wildcard) and the server
        pushes JSON envelopes of type event | push | consumer | schedule.
        A non-upgrade request is rejected with 405.
      parameters:
        - name: events
          in: query
          description: Comma-separated event-name globs to subscribe to (omit for all)
          schema:
            type: string
        - name: channels
          in: query
          description: Comma-separated channel-address globs to subscribe to (omit for all)
          schema:
            type: string
      responses:
        '101':
          description: |
            Switching Protocols — the connection upgrades to a WebSocket and the
            server pushes ManageEnvelope frames (per the envelope schemas; not an
            HTTP response body)
        '405':
          $ref: '#/components/responses/NotUpgraded'
components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
    NewExampleRequestBase:
      type: object
      description: |
        Abstract request fields shared by every example target kind. Not used
        directly — compose via NewExampleRequestSync / NewExampleRequestAsync.
        The shared property bag is left open so target-specific schemas can
        merge it through allOf and partition targeting with oneOf.
      required:
        - response
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]
          default: GET
          description: HTTP method to match
        once:
          type: boolean
          default: false
          description: If true, the example will be returned only once (when conditions are met)
        ttl:
          type: integer
          minimum: 0
          description: Time-to-live in seconds. After this duration the example becomes unavailable and is removed from memory. 0 or omitted means no expiration.
        validate:
          type: boolean
          default: true
          description: Validate the example data against the OpenAPI schema for the path
        conditions:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: object
          description: |
            Conditions to match the request. Keys can be runtime expressions,
            values can be literal values or JSON schemas for validation.
            Keys may reference the reply contexts ({$request.*}, {$message.*},
            {$channel.*}) for OpenAPI/AsyncAPI reply examples, or the event and
            connection contexts ({$event.*}, {$connection.*}) for async-driven
            delivery.
        response:
          $ref: '#/components/schemas/ExampleResponse'
    NewExampleRequestSync:
      type: object
      description: |
        Sync (OpenAPI) target. Requires `path` (plus the shared `response`) and
        forbids every async-only field (protocol/channel/interval/delay);
        mixing target kinds is rejected via the not-fence, so an unknown field
        never silently flips the request onto the async branch.
      allOf:
        - $ref: '#/components/schemas/NewExampleRequestBase'
        - type: object
          required:
            - path
          properties:
            path:
              type: string
              description: The request path (including path parameters) to match (OpenAPI target)
    NewExampleRequestAsync:
      type: object
      description: |
        Async (AsyncAPI) target. Requires `channel` (plus the shared `response`)
        and forbids `path`; mixing target kinds is rejected via the not-fence.
      allOf:
        - $ref: '#/components/schemas/NewExampleRequestBase'
        - type: object
          required:
            - channel
          properties:
            protocol:
              type: string
              enum: [http, ws]
              description: AsyncAPI protocol when targeting an AsyncAPI channel
            channel:
              type: string
              description: AsyncAPI channel address (prefixed) when targeting an AsyncAPI channel
            interval:
              type: integer
              minimum: 1
              description: |
                AsyncAPI-only. Positive millisecond cadence for recurring delivery
                (mirrors x-mock-interval).
            delay:
              type: integer
              minimum: 0
              default: 0
              description: |
                AsyncAPI-only. Millisecond delay before emission after a fire
                (mirrors x-mock-delay).
    AddExampleRequest:
      description: |
        Target discriminator over the concrete example schemas: the sync
        (OpenAPI) branch targets a path, the async (AsyncAPI) branch targets a
        channel. Exactly one branch matches, so mixed targeting is rejected.
      oneOf:
        - $ref: '#/components/schemas/NewExampleRequestSync'
        - $ref: '#/components/schemas/NewExampleRequestAsync'
    ExampleResponse:
      type: object
      required:
        - code
      properties:
        code:
          type: integer
          description: HTTP status code (required)
        headers:
          type: object
          additionalProperties:
            type: string
          description: Response headers
        body:
          oneOf: 
            - type: string
            - type: number
            - type: boolean
            - type: object
            - type: array
              items: {}
          description: Response body (JSON or text)
    AddExampleResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        id:
          type: string
          description: Unique identifier for the added example
        kind:
          type: string
          enum: [event, interval]
          description: Trigger kind for async-driven examples (match/interval)
        jobID:
          type: string
          description: Scheduler job id for interval-driven examples
    RequestHistoryItem:
      type: object
      properties:
        ts:
          type: integer
          description: Timestamp in milliseconds since epoch
        url:
          type: string
          description: Full request URL
        method:
          type: string
          description: HTTP method
        body:
          oneOf: 
            - type: string
            - type: object
            - type: array
              items: {}
          description: Request body (parsed if JSON)
        headers:
          type: object
          additionalProperties:
            type: string
          description: Request headers
    RequestHistoryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RequestHistoryItem'
    FireEventRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The named event to fire
        payload:
          type: object
          description: Event payload exposed to consuming templates via {$event.*}
        delay:
          type: integer
          minimum: 0
          default: 0
          description: Delivery delay in milliseconds
        global:
          type: boolean
          default: false
          description: When true, the event is broadcast over all loaded schemas
    MessagesRequest:
      type: object
      required:
        - channel
      properties:
        channel:
          type: string
          description: AsyncAPI channel address to push to
        connectionId:
          type: string
          description: Target a specific consumer; omitted broadcasts to all
        payload:
          type: object
          description: Message payload, templated with {$state.*}/{$env.*}
        delay:
          type: integer
          minimum: 0
          default: 0
          description: Delivery delay in milliseconds
    AsyncActionResponse:
      type: object
      properties:
        success:
          type: boolean
        name:
          type: string
          description: Fired event name (fire-event endpoints only)
    ConsumersResponse:
      type: object
      properties:
        consumers:
          type: array
          items:
            type: object
            properties:
              connectionId:
                type: string
              channel:
                type: string
              protocol:
                type: string
                enum: [ws, signalr]
              streams:
                type: array
                items:
                  type: object
                  properties:
                    connectionId:
                      type: string
                    invocationId:
                      type: string
                    streamId:
                      type: string
  responses:
    InvalidRequest:
      description: The request is malformed, missing required fields, or references an unknown target
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource (example, connection, or route) does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: An unexpected server-side error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotUpgraded:
      description: The request is a valid GET but did not attempt a WebSocket upgrade
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
