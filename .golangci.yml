# golangci-lint configuration (v2 schema).
# Run locally with: golangci-lint run
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gocyclo
    - gocognit
    - dupl
    - misspell
    - whitespace
    - thelper
    - usestdlibvars
    - errname
  settings:
    gocyclo:
      # Project standard: keep every function under this cyclomatic bound.
      # Lowered from 15 to 10 so ceiling-sitting logic is either simplified or
      # carries an explicit //nolint:gocyclo with a written rationale.
      min-complexity: 10
    gocognit:
      # Flag only deeply tangled functions (handlers and schema registrars
      # legitimately branch on several states); small helpers are preferred.
      # Lowered from 35 to 25 so deeply nested helpers are reviewed.
      min-complexity: 25
    dupl:
      threshold: 150
  exclusions:
    paths:
      - mock/
      - third_party/
    rules:
      # Integration test helpers build and launch the real binary; their JSON
      # fixtures and server stubs resemble one another by design.
      - path: test/
        linters:
          - dupl
      - path: internal/server/.*_test\.go
        linters:
          - dupl